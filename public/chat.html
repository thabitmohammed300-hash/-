<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وصال - المحادثة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  
  <div id="landing" class="join-form">
    <h2 data-i18n="start-conversation">ابدأ محادثتك الخاصة</h2>
    <p data-i18n="enter-room-id">أدخل معرف الغرفة للانضمام إلى محادثة خاصة مع شخص آخر.</p>
    
    <div class="form-actions" style="margin-top: 30px;">
      <button class="button primary" onclick="showCreate()" data-i18n="create-room">إنشاء غرفة جديدة</button>
      <button class="button ghost" onclick="showJoin()" data-i18n="join-existing">الانضمام لغرفة</button>
    </div>
    <div style="margin-top: 20px;">
      <a class="button ghost" href="/" data-i18n="back-home">العودة للرئيسية</a>
    </div>
  </div>

  <div id="create-room" class="join-form" style="display: none;">
    <h2 data-i18n="create-room-title">إنشاء غرفة جديدة</h2>
    
    <div class="form-group">
      <label data-i18n="room-id-label">معرف الغرفة:</label>
      <input type="text" id="create-room-id" data-i18n-placeholder="room-id-placeholder" />
    </div>
    
    <div class="form-group">
      <label data-i18n="room-password-label">كلمة المرور:</label>
      <input type="password" id="create-room-password" data-i18n-placeholder="room-password-placeholder" />
    </div>
    
    <div class="form-actions">
      <button class="button primary" onclick="createRoom()" data-i18n="create">إنشاء</button>
      <button class="button ghost" onclick="showLanding()" data-i18n="cancel">إلغاء</button>
    </div>
  </div>

  <div id="join-room" class="join-form" style="display: none;">
    <h2 data-i18n="join-room-title">انضم إلى غرفة</h2>
    
    <div class="form-group">
      <label data-i18n="room-id-label">معرف الغرفة:</label>
      <input type="text" id="room-id" data-i18n-placeholder="room-id-placeholder" />
    </div>
    
    <div class="form-group">
      <label data-i18n="room-password-label">كلمة المرور:</label>
      <input type="password" id="room-password" data-i18n-placeholder="room-password-placeholder" />
    </div>
    
    <div class="form-actions">
      <button class="button primary" onclick="joinRoom()" data-i18n="join">انضم</button>
      <button class="button ghost" onclick="showLanding()" data-i18n="cancel">إلغاء</button>
    </div>
  </div>

  <div id="chat" class="chat-container" style="display: none;">
    <div class="chat-header">
      <div>
        <span class="title" data-i18n="chat-title">دردشة وصال</span>
        <span class="subtitle" data-i18n="chat-subtitle">معرف الغرفة: <span id="current-room"></span></span>
      </div>
      <button class="button ghost" onclick="leaveRoom()" data-i18n="leave-room">غادر الغرفة</button>
    </div>
    
    <div id="messages" class="messages"></div>
    
    <div class="message-input-container">
      <button class="file-upload-button" data-i18n="attach-file">
        إرفق ملف
        <input type="file" id="file-input" onchange="handleFileSelect(event)" accept="image/*,video/*" />
      </button>
      <input 
        type="text" 
        id="message-input" 
        data-i18n-placeholder="message-placeholder" 
        onkeypress="handleKeyPress(event)"
      />
      <button class="button primary" onclick="sendMessage()" data-i18n="send">إرسال</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
